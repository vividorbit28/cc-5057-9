<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞行航道关卡编辑器 · 受约束空间曲线工程</title>
  <link rel="stylesheet" href="styles/editor.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>飞行航道编辑器</h1>
        <p class="sub">受约束空间曲线内核 · 转弯半径 / 爬升率 / 空间净空联合校核</p>
      </header>

      <section class="panel">
        <h2>关卡样例</h2>
        <div id="scenario-buttons" class="btn-group"></div>
        <p id="scenario-desc" class="desc"></p>
      </section>

      <section class="panel">
        <h2>规划模式</h2>
        <div class="mode-row">
          <label><input type="radio" name="mode" value="A" checked />
            <span><b>模式 A</b> 固定门位 · 重定航速</span></label>
          <label><input type="radio" name="mode" value="B" />
            <span><b>模式 B</b> 锁定航速 · 局部重塑曲线</span></label>
        </div>
        <button id="btn-run-mode" class="primary">执行当前模式</button>
        <p id="mode-status" class="desc"></p>
      </section>

      <section class="panel">
        <h2>门可达时间窗与开放调度</h2>
        <div id="gate-window-table" class="gate-table"></div>
        <p class="desc">调度器在每个门的可达区间内分配通行窗；缩短某门开放窗时若
          与可达区间无交集，将拒绝该航段并要求重拟合。</p>
        <button id="btn-shrink-mid" class="primary">缩短中门开放窗（触发拒绝）</button>
        <button id="btn-refit-leg">重拟合被拒航段</button>
        <p id="schedule-status" class="desc"></p>
      </section>

      <section class="panel">
        <h2>飞行器包络</h2>
        <div id="envelope" class="envelope"></div>
      </section>

      <section class="panel">
        <h2>回放</h2>
        <div class="replay-row">
          <button id="btn-play">▶ 播放</button>
          <button id="btn-pause">⏸ 暂停</button>
          <button id="btn-reset">⟲ 复位</button>
        </div>
        <label class="slider">
          回放进度 <input id="seek" type="range" min="0" max="1000" value="0" />
        </label>
        <label class="slider">
          仿真倍速 <input id="rate" type="range" min="0.25" max="3" step="0.25" value="1" />
          <span id="rate-val">1.0×</span>
        </label>
      </section>

      <section class="panel">
        <h2>显示层</h2>
        <label class="check"><input id="show-ribbon" type="checkbox" checked /> 通道包络带</label>
        <label class="check"><input id="show-guidance" type="checkbox" checked /> 引导点 / 视导结构</label>
        <label class="check"><input id="show-attitude" type="checkbox" checked /> 姿态框架</label>
        <label class="check"><input id="show-volumes" type="checkbox" checked /> 禁止体积</label>
        <label class="check"><input id="show-clearance" type="checkbox" checked /> 障碍间距标注</label>
      </section>

      <section class="panel">
        <h2>航道构造策略（曲线求解比较）</h2>
        <label class="check"><input id="cs-candidates" type="checkbox" /> 叠加分段候选搜索的航迹</label>
        <label class="check"><input id="cs-reverse" type="checkbox" /> 以飞行门反向约束曲率</label>
        <button id="btn-construct" class="primary">用当前策略重建航道</button>
        <button id="btn-compare">比较四种策略（曲率 / 净空 / 门序）</button>
        <div id="compare-table" class="compare-table"></div>
        <p id="construct-status" class="desc"></p>
      </section>

      <section class="panel">
        <h2>实验：曲率上限与碰撞距离</h2>
        <button id="btn-experiments">复算急弯 / 狭窄禁区实验</button>
        <div id="experiment-table" class="experiment-table"></div>
        <p id="experiment-status" class="desc"></p>
      </section>
    </aside>

    <main id="viewport">
      <canvas id="three-canvas"></canvas>
      <div id="hud">
        <div id="hud-stats" class="hud-block"></div>
        <div id="hud-tracking" class="hud-block"></div>
      </div>
      <div id="hint" class="hint">
        拖动 <b>青色控制点</b> 改形 · 拖动 <b>橙色门</b> 移位 · 单击控制点选中后用右侧速度手柄调速
      </div>
    </main>

    <aside id="rightbar">
      <section class="panel">
        <h2>航道运动与障碍间距</h2>
        <div id="result-stats"></div>
      </section>
      <section class="panel">
        <h2>异常提示</h2>
        <div id="alert-box" class="alert-box"></div>
      </section>
      <section class="panel grow">
        <h2>违反条件区段 <span id="violation-count" class="badge"></span></h2>
        <div id="violation-list" class="violation-list"></div>
      </section>
      <section class="panel">
        <h2>选中元素</h2>
        <div id="inspector"><p class="muted">未选中。在视窗中点击控制点或门。</p></div>
      </section>
    </aside>
  </div>

  <script type="module" src="src/editor/main.js"></script>
</body>
</html>
